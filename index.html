<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fbf9df">
<title>中海都阙台｜骑手友好地图</title>
<style>
:root{--bg:#fbf9df;--paper:#fffef1;--line:#eadfbe;--brown:#9a7648;--brown-dark:#745633;--brown-active:#a78355;--cream:#eee4c9;--text:#3f3226;--muted:#b8a98b;--orange:#f39b55;--yellow:#f6c400;--red:#cf2d31}
*{box-sizing:border-box}html,body{margin:0;background:#ece9df;color:var(--text);font-family:"FZLanTingHeiS-R-GB","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}
.app{width:min(100%,480px);margin:auto;min-height:100vh;background:var(--bg);box-shadow:0 0 32px #00000014}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.heroImg{display:block;width:100%;height:auto;background:var(--bg)}
.locationBox{margin:0 22px 18px;padding:16px 16px 18px;border:1px solid var(--line);border-radius:20px;background:#fffdf3aa}
.locationTitle{font-size:14px;color:var(--brown);font-weight:650;margin-bottom:12px}
.gateSwitch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gateBtn{height:54px;border:0;border-radius:18px;background:#ece3ce;color:var(--brown);font-size:18px;font-weight:650;cursor:pointer}
.gateBtn.active{background:var(--brown-active);color:#fff;box-shadow:inset 0 -1px 0 #00000014}
.search{margin:0 22px 22px;height:62px;border:1px solid var(--line);border-radius:19px;background:#fffef6;display:flex;align-items:center;gap:11px;padding:0 18px;color:#9d7f58}
.searchIcon{font-size:27px;font-family:serif;line-height:1;transform:rotate(-18deg)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:17px;font-weight:600;color:var(--brown-dark)}
.search input::placeholder{color:#c9bca2;opacity:1}
.section{padding:0 22px 20px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;padding:0 2px;color:var(--brown)}
.sectionHead h2{margin:0;font-size:20px;font-weight:700}
.sectionHead span{font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.card{min-height:126px;border:1px solid var(--line);border-radius:22px;background:#fffef8;padding:15px 10px;color:var(--brown-dark);font-size:16px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.45;cursor:pointer;box-shadow:0 4px 10px #6d55200a}
.card:active{transform:scale(.985);background:#fbf4de}
.card.hide{display:none}
.card.zoneDisabled,
.card:disabled{
  background:#f0eee8;
  border-color:#e1ddd4;
  color:#b7b0a7;
  box-shadow:none;
  opacity:.58;
  cursor:not-allowed;
  transform:none;
}
.card.zoneDisabled:active,
.card:disabled:active{
  transform:none;
  background:#f0eee8;
}
.section.zoneInactive .sectionHead{
  opacity:.48;
}

.noResult{display:none;margin:0 22px 26px;padding:18px;border-radius:18px;background:#fffef4;border:1px solid var(--line);text-align:center;color:#ad9b7c;font-size:14px}
.footerSpace{height:26px}

/* Route page: keep the original Scheme A interaction structure, restyled to match the new visual system. */
.topbar{position:sticky;top:0;z-index:30;padding:12px 14px;background:#fffdeeea;backdrop-filter:blur(10px);display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line)}
.back{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fffef5;color:var(--brown-dark);font-size:22px;cursor:pointer}
.topbar b{font-size:16px;color:var(--brown-dark)}.topbar small{display:block;color:#a99779;font-size:11px;margin-top:2px}
.mapwrap{padding:13px}
.map{position:relative;aspect-ratio:890/628;background:#ddd;overflow:hidden;border-radius:20px;box-shadow:0 9px 26px #4d35221a;border:1px solid var(--line)}
.map img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.83) brightness(1.04)}
.map:after{content:"";position:absolute;inset:0;background:#fff3;pointer-events:none}
svg{position:absolute;inset:0;width:100%;height:100%;z-index:5}
.routeHalo{fill:none;stroke:#fff;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:#d43a31;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 1.8;animation:run 1.1s linear infinite}@keyframes run{to{stroke-dashoffset:-9.6}}
.pin{position:absolute;z-index:10;transform:translate(-50%,-50%)}
.pin i{display:block;width:20px;height:20px;border:4px solid #fff;border-radius:50%;background:#d43a31;box-shadow:0 3px 12px #0003}
.pin.start i{background:var(--brown-active)}
.pin span{position:absolute;top:25px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fffdf0e8;padding:5px 8px;border-radius:8px;font-size:10px;font-weight:650;box-shadow:0 2px 10px #0002;color:var(--brown-dark)}
.sheet{margin:0 13px 20px;background:#fffef6;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 10px 28px #4a332014}
.row{display:flex;justify-content:space-between;gap:12px}.row h2{font-size:20px;margin:0 0 4px;color:var(--brown-dark)}.muted{color:#98896f;font-size:12px}
.badge{height:max-content;background:#f4ead3;color:var(--brown-dark);border-radius:999px;padding:6px 9px;font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.stat{background:#f6efdE;border-radius:14px;padding:12px}.stat b{font-size:19px;color:var(--brown-dark);display:block}.stat span{font-size:10px;color:#9b8f78}
.primary,.ghost{width:100%;height:46px;border:0;border-radius:13px;cursor:pointer}.primary{background:var(--brown-active);color:white;font-weight:650}.ghost{margin-top:8px;background:#eee5d0;color:var(--brown-dark)}
.steps{padding-top:7px}.step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #eee4cd}.num{width:27px;height:27px;flex:0 0 27px;border-radius:50%;display:grid;place-items:center;background:#eee2c9;color:var(--brown-dark);font-weight:700;font-size:12px}.step p{margin:2px 0 0;font-size:13px;line-height:1.55}
@media(max-width:360px){.card{min-height:112px;font-size:14px}.gateBtn{font-size:16px}}
</style>
</head>

function place(el,x,y){el.style.left=x+'%';el.style.top=y+'%'}
function buildNodes(sx,sy,dx,dy){const mid=(sx+dx)/2;return [[sx,sy],[mid,sy],[mid,dy],[dx,dy]]}
function routeById(id){const p=DATA[id];if(!p)return;current=p;const g=GATES[activeGate];document.getElementById('tbTitle').textContent=p.name;document.getElementById('destName').textContent=p.name;document.getElementById('spName').textContent=g.name;document.getElementById('dpName').textContent=p.name;const d=activeGate==='zone1'?p.d1:p.d2;document.getElementById('distance').textContent=d===0?'已在当前位置':d+' m';document.getElementById('minutes').textContent=d===0?'0 分钟':'约 '+Math.max(1,Math.round(d/75))+' 分钟';place(document.getElementById('sp'),g.x,g.y);place(document.getElementById('dp'),p.x,p.y);const pts=buildNodes(g.x,g.y,p.x,p.y).map(n=>n.join(',')).join(' ');document.getElementById('halo').setAttribute('points',pts);document.getElementById('line').setAttribute('points',pts);document.getElementById('steps').hidden=true;document.getElementById('steps').innerHTML='';go('route')}
function showSteps(){if(!current)return;const s=document.getElementById('steps');s.innerHTML=current.steps.map((t,i)=>`<div class="step"><span class="num">${i+1}</span><p>${t}</p></div>`).join('');s.hidden=false;s.scrollIntoView({behavior:'smooth',block:'nearest'})}
function filterCards(q){
  q=(q||'').trim();
  let visible=0;

  document.querySelectorAll('.card').forEach(c=>{
    const inActiveZone=c.dataset.zone===activeGate;

    if(inActiveZone){
      const ok=!q||c.dataset.key.includes(q);
      c.classList.toggle('hide',!ok);
      if(ok) visible++;
    }else{
      // 另一分区始终保留在页面中，但维持灰显、不可点击
      c.classList.remove('hide');
    }
  });

  document.getElementById('noResult').style.display=visible?'none':'block';
}
document.getElementById('search').addEventListener('input',e=>filterCards(e.target.value));
setGate('zone1');
try{
  const gp=new URLSearchParams(location.search).get('gate');
  if(gp==='2') setGate('zone2');
}catch(e){}
</script>
</body></html>
